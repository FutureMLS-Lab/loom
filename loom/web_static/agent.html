<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Ask Loom</title>
  <link rel="icon" type="image/png" href="/static/loom-logo.png" />
  <link rel="stylesheet" href="/static/factory.css?v=20260829-2" />
  <style>
    /* Ask Loom - chat with the concierge. Base look comes from factory.css. */
    body { min-height: 100vh; }
    .ag-shell {
      display: grid; grid-template-columns: 260px 1fr; gap: 18px;
      max-width: 1180px; margin: 0 auto; padding: 22px 24px 24px;
      height: calc(100vh - 64px);
    }
    .ag-side, .ag-chat {
      background: var(--rf-bg-1); border: 1px solid var(--rf-line);
      border-radius: var(--rf-radius); box-shadow: var(--rf-shadow);
    }
    .ag-side { display: flex; flex-direction: column; min-height: 0; padding: 14px; gap: 10px; }
    .ag-side h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--rf-faint); margin: 6px 4px 0; }
    .ag-sessions { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; min-height: 0; }
    .ag-session {
      display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 10px;
      cursor: pointer; font-size: 13px; color: var(--rf-dim); border: 1px solid transparent;
    }
    .ag-session:hover { background: var(--rf-bg-2); }
    .ag-session.on { background: var(--rf-accent-soft); color: var(--rf-text); border-color: rgba(79,70,229,.25); }
    .ag-session span { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ag-session button { border: 0; background: none; color: var(--rf-faint); cursor: pointer; font-size: 14px; padding: 0 2px; visibility: hidden; }
    .ag-session:hover button { visibility: visible; }
    .ag-side .rf-hint { font-size: 11.5px; line-height: 1.5; margin: 0 4px; }
    .ag-side code { font-family: var(--rf-mono); font-size: 11px; }

    .ag-chat { display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
    .ag-log { flex: 1; overflow-y: auto; padding: 26px 30px 12px; display: flex; flex-direction: column; gap: 14px; }
    .ag-msg { max-width: 82%; padding: 11px 15px; border-radius: 14px; font-size: 14px; line-height: 1.6; overflow-wrap: anywhere; }
    .ag-msg.user { align-self: flex-end; background: var(--rf-accent-soft); border: 1px solid rgba(79,70,229,.18); white-space: pre-wrap; }
    .ag-msg.assistant { align-self: flex-start; background: var(--rf-bg-2); border: 1px solid var(--rf-line); }
    .ag-msg.error { align-self: flex-start; background: var(--rf-bad-soft); border: 1px solid rgba(190,18,60,.25); color: var(--rf-bad); white-space: pre-wrap; }
    .ag-msg.pending { align-self: flex-start; color: var(--rf-faint); font-style: italic; background: none; padding-left: 4px; }
    .ag-msg p { margin: 0 0 .55em; } .ag-msg p:last-child { margin-bottom: 0; }
    .ag-msg ul, .ag-msg ol { margin: .2em 0 .55em 1.2em; padding: 0; }
    .ag-msg li { margin: .15em 0; }
    .ag-msg h3, .ag-msg h4 { margin: .6em 0 .3em; font-size: 14.5px; }
    .ag-msg code { font-family: var(--rf-mono); font-size: 12.5px; background: rgba(31,35,40,.06); padding: 1px 5px; border-radius: 5px; }
    .ag-msg pre { background: #1f2328; color: #e9e7e1; padding: 10px 12px; border-radius: 10px; overflow-x: auto; margin: .4em 0 .6em; }
    .ag-msg pre code { background: none; color: inherit; padding: 0; }
    .ag-msg a { color: var(--rf-accent); }
    .ag-meta { font-size: 11px; color: var(--rf-faint); margin-top: 6px; }

    .ag-empty { margin: auto; text-align: center; max-width: 520px; }
    .ag-empty h1 { font-size: 1.5rem; margin-bottom: 6px; }
    .ag-empty p { color: var(--rf-dim); font-size: 13.5px; line-height: 1.6; }
    .ag-chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 18px; }
    .ag-chip {
      border: 1px solid var(--rf-line); background: var(--rf-bg-1); border-radius: 999px;
      padding: 7px 13px; font-size: 13px; color: var(--rf-text); cursor: pointer;
    }
    .ag-chip:hover { border-color: var(--rf-accent); color: var(--rf-accent); }

    .ag-compose { border-top: 1px solid var(--rf-line); padding: 14px 18px; display: flex; gap: 10px; align-items: flex-end; background: var(--rf-bg-1); }
    .ag-compose textarea {
      flex: 1; resize: none; max-height: 180px; min-height: 44px; padding: 11px 13px;
      border: 1px solid var(--rf-line-2); border-radius: 12px; font: inherit; font-size: 14px;
      background: var(--rf-bg); color: var(--rf-text); outline: none;
    }
    .ag-compose textarea:focus { border-color: var(--rf-accent); box-shadow: 0 0 0 3px var(--rf-accent-soft); }
    @media (max-width: 820px) {
      .ag-shell { grid-template-columns: 1fr; height: auto; padding: 12px; }
      .ag-side { max-height: 200px; }
      .ag-chat { height: calc(100vh - 290px); min-height: 420px; }
      .ag-log { padding: 18px 14px 10px; }
      .ag-msg { max-width: 94%; }
    }
  </style>
</head>
<body>
<header class="rf-top">
  <a class="rf-brand" href="/agent">
    <svg class="rf-mark" width="22" height="22" viewBox="0 0 22 22" aria-hidden="true"><defs><linearGradient id="lg-agent" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6366f1"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs><rect width="22" height="22" rx="6" fill="url(#lg-agent)"/><path fill="#fff" d="M5 6.6a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v5.4a2 2 0 0 1-2 2H10.4L7.2 17v-3H7a2 2 0 0 1-2-2z"/><circle cx="8.6" cy="9.3" r="1" fill="#6366f1"/><circle cx="11" cy="9.3" r="1" fill="#6366f1"/><circle cx="13.4" cy="9.3" r="1" fill="#6366f1"/></svg>
    <span class="rf-brand__name">Ask Loom</span>
  </a>
  <nav class="rf-top__nav">
    <a class="rf-btn rf-btn--ghost" href="/">Console</a>
    <a class="rf-btn rf-btn--ghost" href="/factory">Research Factory</a>
  </nav>
</header>

<div class="ag-shell">
  <aside class="ag-side" aria-label="Conversations">
    <button type="button" class="rf-btn rf-btn--primary" id="ag-new">New conversation</button>
    <h2>Conversations</h2>
    <div class="ag-sessions" id="ag-sessions"></div>
    <p class="rf-hint">Agents can skip the chat and use Loom's tools directly over MCP at <code>/mcp</code> - see <a href="/api/agent/manifest">manifest</a>.</p>
  </aside>

  <section class="ag-chat">
    <div class="ag-log" id="ag-log" aria-live="polite"></div>
    <form class="ag-compose" id="ag-form">
      <textarea id="ag-input" rows="1" placeholder="Ask about tasks, agents, papers… (Enter to send, Shift+Enter for a new line)"></textarea>
      <button type="submit" class="rf-btn rf-btn--primary" id="ag-send">Send</button>
    </form>
  </section>
</div>

<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  const log = $('ag-log'), input = $('ag-input'), send = $('ag-send');
  const KEY = 'loom-agent-session';
  let session = localStorage.getItem(KEY) || '';
  let busy = false;

  const SUGGESTIONS = [
    "What's running right now?",
    "What is waiting on me?",
    "How is the Paper Factory doing?",
    "Summarize the latest review of the paper waiting for my final review",
  ];

  async function api(path, opts = {}) {
    const res = await fetch(path, {
      credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json' },
      ...opts,
    });
    let data = {};
    try { data = await res.json(); } catch (_) { /* empty body */ }
    if (!res.ok || data.ok === false) throw new Error(data.error || `HTTP ${res.status}`);
    return data;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  }

  // A deliberately small markdown renderer: escape first, then format.
  function inline(s) {
    return s
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, '$1<i>$2</i>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  }
  function markdown(text) {
    const out = [];
    const blocks = esc(text).split(/```/);
    blocks.forEach((block, i) => {
      if (i % 2 === 1) { out.push(`<pre><code>${block.replace(/^[a-z0-9]*\n/i, '')}</code></pre>`); return; }
      let list = null;
      const flush = () => { if (list) { out.push(`</${list}>`); list = null; } };
      block.split('\n').forEach((line) => {
        const ul = line.match(/^\s*[-*]\s+(.*)$/), ol = line.match(/^\s*\d+[.)]\s+(.*)$/), h = line.match(/^(#{1,4})\s+(.*)$/);
        if (ul || ol) {
          const kind = ul ? 'ul' : 'ol';
          if (list !== kind) { flush(); out.push(`<${kind}>`); list = kind; }
          out.push(`<li>${inline((ul || ol)[1])}</li>`);
        } else if (h) { flush(); out.push(`<h4>${inline(h[2])}</h4>`); }
        else if (line.trim()) { flush(); out.push(`<p>${inline(line)}</p>`); }
        else flush();
      });
      flush();
    });
    return out.join('');
  }

  function bubble(role, text, meta) {
    const empty = log.querySelector('.ag-empty');
    if (empty) empty.remove();
    const el = document.createElement('div');
    el.className = `ag-msg ${role}`;
    if (role === 'assistant') el.innerHTML = markdown(text);
    else el.textContent = text;
    if (meta) {
      const m = document.createElement('div');
      m.className = 'ag-meta';
      m.textContent = meta;
      el.appendChild(m);
    }
    log.appendChild(el);
    log.scrollTop = log.scrollHeight;
    return el;
  }

  function emptyState() {
    log.innerHTML = '';
    const box = document.createElement('div');
    box.className = 'ag-empty';
    box.innerHTML = '<h1>Ask Loom</h1><p>One conversation with everything on this host: running agents, tasks, worktrees, and the Paper / Review / Rebuttal factories. It reads before it acts, and only changes things when you ask.</p>';
    const chips = document.createElement('div');
    chips.className = 'ag-chips';
    SUGGESTIONS.forEach((s) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'ag-chip'; b.textContent = s;
      b.onclick = () => { input.value = s; submit(); };
      chips.appendChild(b);
    });
    box.appendChild(chips);
    log.appendChild(box);
  }

  async function loadSessions() {
    try {
      const data = await api('/api/agent/sessions');
      const list = $('ag-sessions');
      list.innerHTML = '';
      (data.sessions || []).forEach((s) => {
        const row = document.createElement('div');
        row.className = `ag-session${s.id === session ? ' on' : ''}`;
        row.innerHTML = `<span title="${esc(s.title)}">${esc(s.title || 'Conversation')}</span><button type="button" title="Delete">×</button>`;
        row.querySelector('span').onclick = () => openSession(s.id);
        row.querySelector('button').onclick = async (e) => {
          e.stopPropagation();
          if (!confirm('Delete this conversation?')) return;
          await api(`/api/agent/sessions/${s.id}`, { method: 'DELETE' }).catch(() => {});
          if (s.id === session) newSession();
          loadSessions();
        };
        list.appendChild(row);
      });
    } catch (_) { /* sidebar is best-effort */ }
  }

  async function openSession(id) {
    session = id;
    localStorage.setItem(KEY, id);
    log.innerHTML = '';
    try {
      const data = await api(`/api/agent/sessions/${id}`);
      const turns = (data.session && data.session.turns) || [];
      if (!turns.length) emptyState();
      turns.forEach((t) => bubble(t.role, t.text));
    } catch (_) { newSession(); }
    loadSessions();
  }

  function newSession() {
    session = '';
    localStorage.removeItem(KEY);
    emptyState();
    loadSessions();
    input.focus();
  }

  async function submit() {
    const text = input.value.trim();
    if (!text || busy) return;
    busy = true; send.disabled = true;
    input.value = ''; autosize();
    bubble('user', text);
    const pending = bubble('pending', 'Loom is working…');
    const started = Date.now();
    const timer = setInterval(() => {
      pending.textContent = `Loom is working… ${Math.round((Date.now() - started) / 1000)}s`;
    }, 1000);
    try {
      const data = await api('/api/agent/chat', {
        method: 'POST',
        body: JSON.stringify({ message: text, session: session || undefined }),
      });
      const fresh = !session;
      session = data.session;
      localStorage.setItem(KEY, session);
      pending.remove();
      const secs = Math.round((Date.now() - started) / 1000);
      const cost = typeof data.cost_usd === 'number' ? ` · $${data.cost_usd.toFixed(3)}` : '';
      bubble('assistant', data.reply || '(no reply)', `${secs}s${cost}`);
      if (fresh) loadSessions();
    } catch (err) {
      pending.remove();
      bubble('error', `Could not get an answer: ${err.message}`);
    } finally {
      clearInterval(timer);
      busy = false; send.disabled = false;
      input.focus();
    }
  }

  function autosize() {
    input.style.height = 'auto';
    input.style.height = `${Math.min(input.scrollHeight, 180)}px`;
  }

  $('ag-form').addEventListener('submit', (e) => { e.preventDefault(); submit(); });
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); submit(); }
  });
  input.addEventListener('input', autosize);
  $('ag-new').addEventListener('click', newSession);

  // ?session=<id> deep-links a conversation (bots can post "continue on the web").
  const linked = new URLSearchParams(location.search).get('session');
  if (linked && /^[0-9a-f]{32}$/.test(linked)) session = linked;
  if (session) openSession(session); else { emptyState(); loadSessions(); }
})();
</script>
</body>
</html>
